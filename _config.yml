# GitHub Pages documentation site; does not configure application deployment.
url: "https://gcfernando.github.io"
baseurl: "/gcfernando"
title: "Gehan Fernando"
description: "Public projects and software engineering work by Gehan Fernando, covering C#, .NET, Python, Azure and developer tools."
lang: "en"
plugins:
  - jekyll-sitemap
exclude:
  - packages
  - bin
  - obj
  - node_modules
  - vendor
  - tests
  - .claude
  - .agents
  - .codex
defaults:
  - scope:
      path: "README.md"
    values:
      title: "Gehan Fernando — Software Engineer in .NET and Python"
      description: "Explore Gehan Fernando's public C#/.NET, Python and Azure projects: logging libraries, Windows applications, code examples and developer learning resources."

# Public documentation navigation and presentation.
repository: gcfernando/gcfernando
theme: jekyll-theme-primer
projects_hub: https://gcfernando.github.io/gcfernando/projects/
project_category: "Project collection"
